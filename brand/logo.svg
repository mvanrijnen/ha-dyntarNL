<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b7cff"/>
      <stop offset="1" stop-color="#16c268"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7fbe8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1667d6"/>
      <stop offset="1" stop-color="#1f7ae0"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <g transform="translate(20,21) scale(0.655)">
    <rect width="256" height="256" rx="58" fill="url(#bg)"/>
    <!-- glossy highlight boven -->
    <path d="M58 0 h140 a58 58 0 0 1 58 58 v34 a300 300 0 0 1 -256 -18 v-16 a58 58 0 0 1 58 -58 z"
          fill="#ffffff" opacity="0.14"/>
    <!-- bliksem -->
    <path d="M150 30 L78 154 L120 154 L104 226 L180 100 L136 100 Z"
          fill="url(#bolt)"/>
  </g>

  <!-- naam -->
  <text x="210" y="108" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="92" font-weight="700" letter-spacing="-2"
        dominant-baseline="alphabetic"><tspan fill="url(#ink)">DynTar</tspan><tspan fill="#16c268">NL</tspan></text>

  <!-- subtitel -->
  <text x="214" y="150" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="25" font-weight="600" letter-spacing="7.5" fill="#8b98a7">DYNAMISCHE&#160;TARIEVEN</text>
</svg>
